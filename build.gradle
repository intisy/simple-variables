plugins {
    id 'java'
    id "io.github.intisy.github-gradle" version "1.8.2.1"
    id "io.github.intisy.online-gradle" version "1.4.3"
}

online {
    urls = [
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/test.gradle',
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/base.gradle',
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/wrapper.gradle',
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/repositories.gradle',
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/java_1_8.gradle',
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/jar.gradle',
            'https://raw.githubusercontent.com/intisy/gradle-snippets/main/publishing.gradle'
    ]
}

github {
    accessToken = System.getenv("GITHUB_TOKEN") ?: ""
}

publishGithub {
    releaseName = "Release ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = ""
            jar = file("build/libs/simple-variables.jar")
        }
    }
}

dependencies {
    githubImplementation "intisy:java-utils:1.4.1"
    compileOnly "com.google.code.gson:gson:2.13.1"
}

// javac leaves the source encoding unset, so it follows whatever the build JVM reports, and that
// is not reliably anything: measured on one Windows box with JDK 17, Gradle 8.11.1 read these
// sources as Cp1252 while 7.6.4 read them as UTF-8. Pinning it makes the compiled bytes the same
// everywhere rather than a property of the build that ran.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
